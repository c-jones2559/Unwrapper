<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The ?v= stops browsers mixing old and new files after an update. When changing any
         CSS or JS, bump it everywhere (grep for "?v=": both html files and the imports in the js) -->
    <link rel="stylesheet" href="style.css?v=2">
    <title>Unwrapper</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>
    <h1>Unwrapper</h1>
    <h2>New here? Here's some <a href="https://unwrapper.cjones.cymru/info">info</a>.</h2>
    <label for="input">Input your data here:</label><br/>


    <input type="file" id="input" name="input" accept=".json" multiple/>
    <!-- <button id="processBtn" onclick="buttonClick()">Process</button> -->

    <button id="processBtn">Process</button>
    <script type="module" src="fileReader.js?v=2"></script>
    
    <!-- <p id="valid"></p> -->

    <section id="bento-grid" class="hidden">
        <div class="card big-card">
            <h3>Total Time</h3>
            <div id="total-time-display">0 mins</div>
        </div>
        <div class="card small-card">
            <h3>Top Artist</h3>
            <div id="top-artist-display">-</div>
        </div>
        <div class="card small-card">
            <h3>Top Song</h3>
            <div id="top-song-display">-</div>
        </div>
    </section>
    
    <nav id="controls" class="hidden">
        <div class="tabs">
            <button class="tab-btn active" data-tab="songs">Songs</button>
            <button class="tab-btn" data-tab="artists">Artists</button>
            <button class="tab-btn" data-tab="albums">Albums</button>
            <button class="tab-btn" data-tab="graph">Graph</button>
        </div>
    
        <div class="filters">
            <!-- Sorts the lists and switches the graph between listens and hours -->
            <div class="metric-toggle" role="group" aria-label="Rank by">
                <button class="metric-btn" data-metric="plays" aria-pressed="false">Plays</button>
                <button class="metric-btn active" data-metric="time" aria-pressed="true">Time</button>
            </div>
            <select id="time-range">
                <option value="all">All Time</option>
            </select>
            <!-- Only shows once a year is picked -->
            <select id="month-range" class="hidden">
                <option value="all">All months</option>
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
            <!-- Only shows for Custom range -->
            <span id="custom-range" class="hidden">
                <input type="date" id="custom-from" aria-label="From">
                to
                <input type="date" id="custom-to" aria-label="To">
            </span>
        </div>
    </nav>

<div id="content-viewport">
    </div>

    <!-- <script src="fileReader.js?v=2"></script> -->
    <!-- <script src="statsProcessor.js"></script> -->
</body>
</html>
